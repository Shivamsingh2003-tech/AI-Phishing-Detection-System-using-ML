<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #111827);
            font-family: "Segoe UI", Arial, sans-serif;
            color: #e5e7eb;
        }

        .reset-card {
            width: 460px;
            max-width: 100%;
            padding: 42px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: auto;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 18px 45px rgba(37, 99, 235, 0.35);
        }

        .title {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .title h2 {
            color: white;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .title p {
            color: #94a3b8;
            margin: 0;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            height: 55px;
            border-radius: 12px;
            background: #020617 !important;
            color: #e5e7eb !important;
            border: 1px solid #334155 !important;
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .btn-send {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            transition: 0.3s;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            color: #7dd3fc;
        }

        .security-note {
            margin-top: 25px;
            padding: 14px;
            border-radius: 14px;
            background: #020617;
            border: 1px solid #334155;
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 576px) {
            .reset-card {
                padding: 28px;
            }
        }
    </style>
</head>

<body>

<div class="reset-card">

    <div class="logo">
        🔐
    </div>

    <div class="title">

        <h2>Forgot Password?</h2>

        <p>
            Reset your Admin Panel password
        </p>

    </div>

    {% if error %}

    <div class="alert alert-danger">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        <div class="mb-4">

            <label class="form-label">
                Admin Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter your admin username"
                autocomplete="username"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-primary btn-send">

            📧 Send OTP

        </button>

    </form>

    <a
        href="{{ url_for('login') }}"
        class="back-link">

        ← Back to Admin Login

    </a>

    <div class="security-note">

        🛡️ A 6-digit OTP will be sent to the registered
        administrator email address.

        <br>

        OTP will expire after 5 minutes.

    </div>

</div>

</body>

</html>
