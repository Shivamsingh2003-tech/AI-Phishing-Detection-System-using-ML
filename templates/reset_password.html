<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827
                );

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            color: #e5e7eb;
        }

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle,
                    #38bdf822 1px,
                    transparent 1px
                );

            background-size: 42px 42px;

            z-index: -1;
        }

        .reset-card {

            width: 470px;

            max-width: 100%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            backdrop-filter:
                blur(16px);

            padding: 42px;

            border-radius: 28px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.35);

            animation:
                slideUp 0.6s;
        }

        @keyframes slideUp {

            from {

                opacity: 0;

                transform:
                    translateY(35px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        .logo {

            width: 90px;

            height: 90px;

            margin: auto;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 42px;

            box-shadow:
                0 18px 45px
                rgba(
                    37,
                    99,
                    235,
                    0.35
                );
        }

        .title {

            text-align: center;

            margin-top: 18px;

            margin-bottom: 30px;
        }

        .title h2 {

            font-weight: 800;

            margin-bottom: 7px;

            color: #ffffff;
        }

        .title p {

            color: #94a3b8;

            margin-bottom: 0;

            font-size: 14px;
        }

        .form-label {

            font-weight: 600;

            color: #e5e7eb;
        }

        .input-group {

            margin-bottom: 20px;
        }

        .input-group-text {

            background: #020617;

            color: #38bdf8;

            border:
                1px solid
                #334155;

            border-radius:
                12px 0 0 12px;
        }

        .form-control {

            height: 55px;

            background:
                #020617 !important;

            color:
                #e5e7eb !important;

            border:
                1px solid
                #334155 !important;

            border-radius:
                0 12px 12px 0;
        }

        .form-control::placeholder {

            color: #64748b !important;
        }

        .password-help {

            margin-top: -12px;

            margin-bottom: 20px;

            color: #94a3b8;

            font-size: 12px;
        }

        .btn-reset {

            width: 100%;

            padding: 14px;

            font-size: 17px;

            font-weight: 800;

            border-radius: 14px;

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            transition: 0.3s;
        }

        .btn-reset:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 30px
                rgba(
                    37,
                    99,
                    235,
                    0.35
                );
        }

        .security-note {

            background:
                #020617;

            border:
                1px solid
                #334155;

            border-radius:
                15px;

            padding:
                14px;

            color:
                #94a3b8;

            font-size:
                13px;

            margin-top:
                20px;

            text-align:
                center;
        }

        .back-link {

            display: block;

            margin-top: 20px;

            text-align: center;

            color: #38bdf8;

            text-decoration: none;

            font-weight: 600;
        }

        .back-link:hover {

            color: #7dd3fc;
        }

        .alert {

            border-radius: 14px;

            margin-bottom: 20px;
        }

        @media (max-width: 576px) {

            .reset-card {

                padding: 28px;
            }
        }

    </style>

</head>

<body>

<div class="reset-card">

    <!-- LOGO -->

    <div class="logo">

        🔐

    </div>


    <!-- TITLE -->

    <div class="title">

        <h2>
            Reset Password
        </h2>

        <p>
            Create a new Admin Panel password
        </p>

    </div>


    <!-- ERROR -->

    {% if error %}

    <div class="alert alert-danger">

        <i class="fa-solid fa-circle-exclamation"></i>

        {{ error }}

    </div>

    {% endif %}


    <!-- RESET PASSWORD FORM -->

    <form
        method="POST"
        onsubmit="return validatePassword()">


        <!-- NEW PASSWORD -->

        <div class="mb-3">

            <label
                class="form-label">

                New Password

            </label>

            <div class="input-group">

                <span
                    class="input-group-text">

                    <i
                        class="fa-solid fa-lock">
                    </i>

                </span>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    class="form-control"
                    placeholder="Enter new password"
                    minlength="4"
                    required>

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="mb-3">

            <label
                class="form-label">

                Confirm New Password

            </label>

            <div class="input-group">

                <span
                    class="input-group-text">

                    <i
                        class="fa-solid fa-lock">
                    </i>

                </span>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm new password"
                    minlength="4"
                    required>

            </div>

        </div>


        <div class="password-help">

            Password must contain at least
            4 characters.

        </div>


        <!-- SUBMIT -->

        <button
            type="submit"
            class="btn btn-primary btn-reset">

            <i
                class="fa-solid fa-key">
            </i>

            Reset Password

        </button>

    </form>


    <!-- SECURITY NOTE -->

    <div class="security-note">

        <i
            class="fa-solid fa-shield-halved">
        </i>

        Your password will be updated after
        successful OTP verification.

    </div>


    <!-- BACK -->

    <a
        href="{{ url_for('login') }}"
        class="back-link">

        ← Back To Admin Login

    </a>

</div>


<script>

function validatePassword() {

    const password =
        document.getElementById(
            "new_password"
        ).value;

    const confirmPassword =
        document.getElementById(
            "confirm_password"
        ).value;


    if (password.length < 4) {

        alert(
            "Password must contain at least 4 characters."
        );

        return false;
    }


    if (password !== confirmPassword) {

        alert(
            "Passwords do not match."
        );

        return false;
    }


    return true;
}

</script>

</body>

</html>
