<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #111827);
            font-family: "Segoe UI", Arial, sans-serif;
            color: #e5e7eb;
        }

        .otp-card {
            width: 460px;
            max-width: 100%;
            padding: 42px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: auto;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 18px 45px rgba(37, 99, 235, 0.35);
        }

        .title {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .title h2 {
            color: white;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .title p {
            color: #94a3b8;
            margin: 0;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            height: 58px;
            border-radius: 12px;
            background: #020617 !important;
            color: #ffffff !important;
            border: 1px solid #334155 !important;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 8px;
        }

        .form-control::placeholder {
            color: #64748b;
            font-size: 14px;
            letter-spacing: normal;
        }

        .btn-verify {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            transition: 0.3s;
        }

        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            color: #7dd3fc;
        }

        .security-note {
            margin-top: 25px;
            padding: 14px;
            border-radius: 14px;
            background: #020617;
            border: 1px solid #334155;
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
        }

        .otp-info {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .otp-info strong {
            color: #38bdf8;
        }

        @media (max-width: 576px) {
            .otp-card {
                padding: 28px;
            }
        }
    </style>
</head>

<body>

<div class="otp-card">

    <div class="logo">
        🔑
    </div>

    <div class="title">

        <h2>Verify OTP</h2>

        <p>
            Enter the OTP sent to your email
        </p>

    </div>

    <div class="otp-info">
        A 6-digit verification code has been sent
        to your registered administrator email.
        <br>
        <strong>OTP expires in 5 minutes.</strong>
    </div>

    {% if error %}

    <div class="alert alert-danger">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        <div class="mb-4">

            <label class="form-label">
                Enter OTP
            </label>

            <input
                type="text"
                name="otp"
                class="form-control"
                placeholder="000000"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-primary btn-verify">

            🔐 Verify OTP

        </button>

    </form>

    <a
        href="{{ url_for('forgot_password') }}"
        class="back-link">

        ← Request New OTP

    </a>

    <div class="security-note">

        🛡️ Never share your OTP with anyone.

        <br>

        Maximum 5 incorrect attempts are allowed.

    </div>

</div>

</body>

</html>
